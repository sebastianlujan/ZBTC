<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wallet ZBTC de prueba: transferencias protegidas sobre Bitcoin regtest, con terminal, explorer y debug.">
<meta name="theme-color" content="#0a0a0a">
<title>ZBTC Wallet · regtest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<!-- devices.css 0.2.0 (MIT), pinned; the hash matches the npm tarball's dist/devices.min.css. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/devices.css@0.2.0/dist/devices.min.css" integrity="sha384-6IKjdZON8Q6CnuK2A5ilDDsDteadAtMqX2kASos/jbEsLkNPOLjA0DwS28WqhT1c" crossorigin="anonymous">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Saltar a la wallet</a>

<header class="nav">
  <div class="nav-left">
    <a class="brand" href="#main">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 3.5h10L3.5 12.5h9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>ZBTC</span>
    </a>
    <span class="slash" aria-hidden="true">/</span>
    <div class="accounts" id="accounts" role="radiogroup" aria-label="Cuenta"></div>
    <span class="net">regtest</span>
  </div>
  <div class="nav-right">
    <span class="chain-pill" id="chain-pill"></span>
    <button class="btn btn-sm" id="mine" type="button">Minar bloque</button>
    <button class="btn btn-sm panel-toggle" id="panel-toggle" type="button" aria-controls="panel" aria-expanded="false">terminal</button>
  </div>
</header>

<div class="shell">
  <main id="main">
    <div class="stage" id="stage">
      <div class="phone-box" id="phone-box">
        <div class="device device-iphone-14-pro device-black">
          <div class="device-frame">
            <div class="device-screen">
              <div class="statusbar" aria-hidden="true">
                <span id="clock">9:41</span>
                <span class="status-icons">
                  <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                  <svg viewBox="0 0 16 12"><path d="M8 12l2.4-2.9a3.6 3.6 0 0 0-4.8 0z"/><path d="M8 5.4c1.7 0 3.3.6 4.5 1.7l1.5-1.8A9 9 0 0 0 8 3a9 9 0 0 0-6 2.3l1.5 1.8A6.6 6.6 0 0 1 8 5.4z"/></svg>
                  <svg viewBox="0 0 27 12"><rect x="0.5" y="0.5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity="0.45"/><rect x="2" y="2" width="18" height="8" rx="1.6"/><path d="M25 4.2v3.6a1.9 1.9 0 0 0 0-3.6z" opacity="0.45"/></svg>
                </span>
              </div>
              <div class="app" id="app"></div>
              <div class="phone-toast" id="toast-slot"></div>
              <div class="sheet-layer" id="sheet-layer" hidden></div>
            </div>
          </div>
          <div class="device-stripe"></div>
          <div class="device-header"></div>
          <div class="device-sensors"></div>
          <div class="device-btns"></div>
          <div class="device-power"></div>
          <div class="device-home"></div>
        </div>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Panel de desarrollo">
    <div class="panel-resizer" id="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Ancho del panel (doble clic: ancho por defecto)" tabindex="0"></div>
    <div class="panel-bar">
      <div class="tabs" role="tablist" aria-label="Vistas del panel">
        <button type="button" role="tab" data-tab="terminal" aria-controls="tab-terminal">terminal</button>
        <span class="pipe" aria-hidden="true">|</span>
        <button type="button" role="tab" data-tab="explorer" aria-controls="tab-explorer">explorer</button>
        <span class="pipe" aria-hidden="true">|</span>
        <button type="button" role="tab" data-tab="debug" aria-controls="tab-debug">debug</button>
      </div>
      <div class="panel-actions">
        <button type="button" id="panel-max" title="Pantalla completa (Esc para volver)">maximizar</button>
        <button type="button" id="panel-close">ocultar</button>
      </div>
    </div>
    <div class="panel-body" id="tab-terminal" role="tabpanel" aria-label="terminal">
      <p class="term-empty"># cada acción muestra aquí los comandos que ejecuta, con una línea # que explica por qué</p>
    </div>
    <div class="panel-body" id="tab-explorer" role="tabpanel" aria-label="explorer" hidden></div>
    <div class="panel-body" id="tab-debug" role="tabpanel" aria-label="debug" hidden></div>
  </aside>
</div>

<!-- Apache ECharts 5.6.0, pinned; the hash matches the npm tarball's dist/echarts.min.js. -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<script src="/app.js"></script>
</body>
</html>
